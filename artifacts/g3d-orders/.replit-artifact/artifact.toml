kind = "web"
previewPath = "/"
title = "G3D Orders"
description = "A configurable storefront for G3D Squish printed lattice products, with product customization, an order flow, and shop administration."
version = "1.0.0"
id = "artifacts/g3d-orders"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21878

[services.development]
run = "pnpm --filter @workspace/g3d-orders run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/g3d-orders", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/g3d-orders", "run", "serve" ]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
BASE_PATH = "/"

[services.env]
PORT = "21878"
BASE_PATH = "/"
